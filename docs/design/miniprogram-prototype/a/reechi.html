<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>锐奇热点 锐奇</title>
<style>
  :root {
    --ink: #13191c;        /* 墨：logo 底色，品牌头、标题、节点 */
    --star: #2ce2e8;       /* 星青：只做图形和底色，不做字 */
    --work: #f2f3f5;       /* 工作灰：微信工作区 */
    --card: #ffffff;
    --iron: #5d6872;       /* 铁灰：来源、元数据 5.7:1 */
    --fog: #a9b4ba;        /* 雾灰：深色区次要字 8.4:1 */
    --body: #4a555e;       /* 摘要正文 7.6:1 */
    --rail: #c5cbd0;       /* 轴线、挂线 */
    /* 分类色标：只做小圆点和浅底，字一律墨色 */
    --c-battery: #ff7a45;
    --c-storage: #1fb57a;
    --c-semi: #3b7bf6;
    --c-film: #8f6cf6;
    --c-inspect: #2ce2e8;
    --c-policy: #13191c;
    --c-general: #8a959e;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: #d9dcdf;
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; padding: 24px 0;
    font-family: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
    -webkit-font-smoothing: antialiased;
    color: var(--ink);
  }
  .phone {
    position: relative; width: 390px; height: 844px; flex: none;
    overflow: hidden; border-radius: 40px; background: var(--work);
    box-shadow: 0 30px 60px -20px rgba(19,25,28,.35), 0 0 0 1px rgba(19,25,28,.08);
  }
  .scroll {
    position: absolute; left: 0; top: 0; width: 390px; height: 761px;
    overflow-x: hidden; overflow-y: auto; scrollbar-width: none;
  }
  .scroll::-webkit-scrollbar { display: none; }

  /* ---------- 深色头部（比精选矮） ---------- */
  .dash {
    background: var(--ink); color: #fff;
    padding: 47px 16px 40px;
  }
  .nav {
    height: 44px; display: flex; align-items: center;
    padding-right: 90px; /* 右侧留给微信胶囊 */
  }
  .nav svg { width: 24px; height: 24px; border-radius: 6px; box-shadow: 0 0 0 1px rgba(255,255,255,.14); }
  .nav h1 { font-size: 17px; font-weight: 600; margin-left: 9px; letter-spacing: .5px; }

  .brand { display: flex; align-items: center; gap: 14px; margin-top: 10px; }
  .brand svg { flex: none; width: 56px; height: 56px; border-radius: 13px; box-shadow: 0 0 0 1px rgba(255,255,255,.14); }
  .brand h2 { font-size: 24px; line-height: 32px; font-weight: 700; letter-spacing: .5px; }
  .brand p { font-size: 13px; line-height: 19px; color: var(--fog); margin-top: 1px; }

  /* ---------- 白卡 ---------- */
  .sheet {
    position: relative; margin: 10px 16px 0;
    background: var(--card); border-radius: 12px;
    padding: 14px 16px 16px;
    box-shadow: 0 1px 2px rgba(19,25,28,.06);
  }
  .sheet.lead { /* 第一张卡压在深色头部下沿，同精选的焦点卡 */
    margin-top: -24px; border-radius: 14px;
    box-shadow: 0 14px 28px -10px rgba(19,25,28,.32), 0 2px 6px rgba(19,25,28,.08);
  }
  .sheet h3 { font-size: 15px; line-height: 22px; font-weight: 700; letter-spacing: .2px; }
  .sheet .text { font-size: 14px; line-height: 22px; color: var(--body); margin-top: 6px; overflow-wrap: anywhere; }

  .tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 10px; }
  .tile {
    min-height: 76px; padding: 12px; border-radius: 10px; background: var(--work);
    display: flex; flex-direction: column; justify-content: space-between; gap: 8px;
  }
  .tile svg { width: 22px; height: 22px; fill: none; stroke: var(--iron); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .tile span { font-size: 13px; line-height: 18px; color: var(--body); }

  /* ---------- 列表卡 ---------- */
  .list { padding: 4px 0; }
  .cell {
    display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 14px 0 16px;
    color: var(--ink); text-decoration: none;
  }
  .cell .ico { flex: none; width: 20px; height: 20px; fill: none; stroke: var(--ink); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .cell .body {
    flex: 1; min-width: 0; align-self: stretch;
    display: flex; align-items: center; gap: 12px;
  }
  .cell + .cell .body { box-shadow: inset 0 1px 0 #eceef0; }
  .cell .lbl { font-size: 15px; line-height: 21px; white-space: nowrap; }
  .cell .val { margin-left: auto; font-size: 13px; line-height: 18px; color: var(--iron); white-space: nowrap; }
  .cell .chev { flex: none; width: 16px; height: 16px; margin-left: auto; fill: none; stroke: var(--iron); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .cell .val + .chev { margin-left: 0; }

  .note { padding: 14px 20px 16px; font-size: 12px; line-height: 19px; color: var(--iron); overflow-wrap: anywhere; }

  /* ---------- 原生 tabBar ---------- */
  .tabbar {
    position: absolute; left: 0; bottom: 0; width: 390px; height: 83px;
    background: #fff; box-shadow: inset 0 .5px 0 rgba(0,0,0,.14);
    padding-bottom: 34px; display: flex;
  }
  .tab {
    flex: 1; height: 49px; display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    padding-top: 6px; color: #6b757e; text-decoration: none;
  }
  .tab svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .tab span { font-size: 10px; line-height: 14px; margin-top: 2px; }
  .tab.on { color: var(--ink); }
  .tab.on span { font-weight: 600; }
</style>
</head>
